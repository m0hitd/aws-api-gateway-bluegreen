name: Deploy Blue-Green API

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  TF_VAR_suffix: mohit

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Zip Lambda functions
        run: |
          cd src/blue && zip blue.zip handler.py && cd ../..
          cd src/green && zip green.zip handler.py && cd ../..

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_lambda_role_arn: ${{ secrets.LAMBDA_ROLE_ARN }}

      - name: Print API endpoint
        run: terraform -chdir=terraform output api_endpoint